name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Public demo on GitHub Pages (static hosting, no server).
# The app is fully mock-backed (MockAuthGateway + mock admin gateways),
# so the production build stays offline with demo login 09123456789/admin1234.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx ng build --configuration production --base-href /Nobatifa-Admin/
      - run: cp dist/nobatifa-admin/browser/index.html dist/nobatifa-admin/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/nobatifa-admin/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
